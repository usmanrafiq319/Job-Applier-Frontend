<div
  class="
    flex
    h-full
    flex-col
    bg-slate-950
    text-white
  "
>

  <!-- Brand -->

  <div
    class="
      flex
      h-16
      items-center
      justify-between
      border-b
      border-white/10
      px-5
    "
  >

    <div
      class="
        flex
        items-center
        gap-3
      "
    >

      <div
        class="
          flex
          size-9
          items-center
          justify-center
          rounded-xl
          bg-brand-600
          text-sm
          font-bold
          text-white
        "
      >
        JA
      </div>


      <div>

        <div
          class="
            text-sm
            font-semibold
            tracking-tight
          "
        >
          Job Applier
        </div>

        <div
          class="
            text-xs
            text-slate-400
          "
        >
          AI Career Agent
        </div>

      </div>

    </div>


    @if (showCloseButton()) {

      <button
        type="button"
        class="
          btn
          btn-ghost
          size-9
          !p-0
          !text-slate-300
          hover:!bg-white/10
          hover:!text-white
        "
        aria-label="Close sidebar"
        (click)="close()"
      >
        ×
      </button>

    }

  </div>


  <!-- Navigation -->

  <nav
    class="
      flex-1
      overflow-y-auto
      px-3
      py-5
    "
  >

    <p
      class="
        mb-2
        px-3
        text-[11px]
        font-semibold
        uppercase
        tracking-[0.14em]
        text-slate-500
      "
    >
      Workspace
    </p>


<div class="space-y-1">

  @for (
    item of navigationItems;
    track item.route
  ) {

    @if (item.enabled) {

      <a
        [routerLink]="item.route"

        routerLinkActive="
          bg-white
          text-slate-950
        "

        [routerLinkActiveOptions]="{
          exact: true
        }"

        (click)="close()"

        class="
          flex
          w-full
          items-center
          gap-3
          rounded-xl
          px-3
          py-2.5
          text-left
          text-sm
          font-medium
          text-slate-300
          transition
          hover:bg-white/10
          hover:text-white
        "
      >

        <span
          class="
            flex
            size-8
            items-center
            justify-center
            rounded-lg
            bg-white/5
            text-sm
          "
        >
          {{ item.icon }}
        </span>

        {{ item.label }}

      </a>

    } @else {

      <button
        type="button"
        disabled

        class="
          flex
          w-full
          cursor-not-allowed
          items-center
          gap-3
          rounded-xl
          px-3
          py-2.5
          text-left
          text-sm
          font-medium
          text-slate-600
        "
      >

        <span
          class="
            flex
            size-8
            items-center
            justify-center
            rounded-lg
            bg-white/5
            text-sm
          "
        >
          {{ item.icon }}
        </span>


        <span class="flex-1">
          {{ item.label }}
        </span>


        <span
          class="
            text-[10px]
            uppercase
            tracking-wider
            text-slate-600
          "
        >
          Soon
        </span>

      </button>

    }

  }

</div>

  </nav>


  <!-- Bottom status -->

  <div
    class="
      border-t
      border-white/10
      p-4
    "
  >

    <div
      class="
        rounded-xl
        bg-white/5
        p-3
      "
    >

      <div
        class="
          flex
          items-center
          gap-2
        "
      >

        <span
          class="
            size-2
            rounded-full
            bg-emerald-400
          "
        ></span>

        <span
          class="
            text-xs
            font-medium
            text-slate-300
          "
        >
          Frontend setup
        </span>

      </div>


      <p
        class="
          mt-1.5
          text-xs
          leading-5
          text-slate-500
        "
      >
        Agent services will connect later.
      </p>

    </div>

  </div>

</div>
