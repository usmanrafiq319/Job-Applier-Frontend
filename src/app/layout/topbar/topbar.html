<header
  class="
    sticky
    top-0
    z-30
    flex
    h-16
    items-center
    justify-between
    border-b
    border-slate-200
    bg-white/95
    px-4
    backdrop-blur
    sm:px-6
    lg:px-8
  "
>

  <div
    class="
      flex
      items-center
      gap-3
    "
  >

    <!-- Mobile sidebar button -->

    <button
      type="button"
      class="
        btn
        btn-secondary
        size-10
        !p-0
        lg:hidden
      "
      aria-label="Open navigation"
      (click)="openMenu()"
    >
      ☰
    </button>


    <div>

      <p
        class="
          text-sm
          font-semibold
          text-slate-950
        "
      >
        Career Workspace
      </p>

      <p
        class="
          hidden
          text-xs
          text-slate-500
          sm:block
        "
      >
        AI-assisted job matching & outreach
      </p>

    </div>

  </div>


  <div
    class="
      flex
      items-center
      gap-3
    "
  >

    <div
      class="
        hidden
        items-center
        gap-2
        rounded-full
        border
        border-slate-200
        bg-slate-50
        px-3
        py-1.5
        text-xs
        font-medium
        text-slate-600
        sm:flex
      "
    >

      <span
        class="
          size-2
          rounded-full
          bg-emerald-500
        "
      ></span>

      Human approval enabled

    </div>


    <button
      type="button"
      class="
        flex
        size-10
        items-center
        justify-center
        rounded-full
        bg-slate-950
        text-sm
        font-semibold
        text-white
      "
      aria-label="User profile"
    >
      U
    </button>

  </div>

</header>
