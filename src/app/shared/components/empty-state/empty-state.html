<div
  class="
    py-14
    text-center
  "
>

  <div
    class="
      mx-auto
      flex
      size-14
      items-center
      justify-center
      rounded-2xl
      bg-slate-100
      text-xl
      text-slate-600
    "
  >
    {{ icon() }}
  </div>


  <h3
    class="
      mt-4
      font-semibold
      text-slate-900
    "
  >
    {{ title() }}
  </h3>


  @if (description()) {

    <p
      class="
        mx-auto
        mt-2
        max-w-md
        text-sm
        leading-6
        text-slate-500
      "
    >
      {{ description() }}
    </p>

  }


  @if (actionLabel()) {

    <button
      type="button"
      class="
        btn
        btn-secondary
        mt-5
      "
      (click)="actionRequested.emit()"
    >
      {{ actionLabel() }}
    </button>

  }

</div>
